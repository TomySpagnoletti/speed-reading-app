[package]
name = "speedread"
version = "0.1.0"
description = "Speed reading for agent outputs"
authors = ["Tomy Spagnoletti"]
edition = "2021"

[lib]
name = "speedread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
